<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solar Calculator</title>  

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />  

<style>
*{box-sizing:border-box;margin:0;font-family:'Times New Roman',Times,serif}
body{background:#111;color:#eee;overflow-x:hidden}

/* Header */
header{
background:#000;color:#FFD700;padding:15px 30px;
display:flex;justify-content:space-between;align-items:center;
font-size:24px;font-weight:bold;position:fixed;top:0;left:0;width:100%;z-index:100
}
nav{display:flex;gap:20px}
nav a{color:#FFD700;text-decoration:none;font-size:24px}
.hamburger{display:none;cursor:pointer}
@media(max-width:768px){
nav{display:none;position:absolute;top:60px;right:0;background:#1a1a1a;flex-direction:column;padding:10px}
nav.show{display:flex}
.hamburger{display:block}
}

/* Hero */
.home-video{height:100vh;position:relative}
.bg-video{width:100%;height:100%;object-fit:cover}
.home-overlay{
position:absolute;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.4);display:flex;flex-direction:column;
justify-content:center;align-items:center;color:#FFD700;text-align:center
}

/* Calculator */
.section{padding:100px 20px;text-align:center}
.calculator{max-width:500px;margin:auto}
.input-card{background:#1a1a1a;margin-top:12px;padding:12px;border-radius:8px}
.input-card label{color:#FFD700;font-weight:bold}
.input-card input{width:100%;padding:8px;background:#000;color:#fff;border:none}
button{
margin-top:20px;width:100%;padding:15px;
background:linear-gradient(45deg,#FFD700,#FFA500);
border:none;border-radius:30px;font-weight:bold
}

/* WhatsApp */
.whatsapp-circle{
position:fixed;bottom:25px;right:25px;background:#25D366;
width:60px;height:60px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:30px;color:white;z-index:200
}
</style>

<!-- Google Analytics GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2RBYGDKE96"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2RBYGDKE96');
</script>
</head>

<body>

<header>
<div>☀ Solar Calculator</div>
<div class="hamburger" onclick="toggleMenu()">☰</div>
<nav id="nav-menu">
<a href="#home">🏠</a>
<a href="#calculator">🧮</a>
<a href="#about">ℹ</a>
</nav>
</header>

<section id="home" class="home-video">
<video autoplay muted loop class="bg-video">
<source src="VID_20260128_171351.mp4" type="video/mp4">
</video>
<div class="home-overlay">
<h1>Power Your Home with Solar</h1>
<a href="#calculator">Calculate Load</a>
</div>
</section>

<section id="calculator" class="section">
<h2>Solar Load Calculator</h2>

<div class="calculator">
<div class="input-card"><label>Fans</label><input id="fans" type="number" value="0"></div>
<div class="input-card"><label>AC 1hp</label><input id="ac1" type="number" value="0"></div>
<div class="input-card"><label>Lights</label><input id="lights" type="number" value="0"></div>
<div class="input-card"><label>TV</label><input id="tv" type="number" value="0"></div>
<div class="input-card"><label>Backup Hours</label><input id="hours" type="number" value="0"></div>

<div id="result"></div>
<button id="pricingBtn" onclick="sendToWhatsApp()">Get Pricing</button>
</div>
</section>

<section id="about" class="section">
<h2>About</h2>
<p>Professional solar solutions across Nigeria.</p>
</section>

<!-- WhatsApp Button -->
<a id="whatsappBtn" class="whatsapp-circle"
href="https://wa.me/2347059640476" target="_blank">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
// Menu
function toggleMenu(){
document.getElementById("nav-menu").classList.toggle("show");
}

// Calculator
const watts={fans:75,ac1:750,lights:20,tv:150};
function calc(){
let total=0;
for(let id in watts){
total+=document.getElementById(id).value*watts[id];
}
let kva=(total/1000).toFixed(2);
document.getElementById("result").innerHTML=`Estimated Load: <b>${kva} kVA</b>`;
}
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));

// WhatsApp pricing
function sendToWhatsApp(){
let msg="Hi, I need a solar system quote.";
window.open("https://wa.me/2347059640476?text="+encodeURIComponent(msg));
}

// GA4 WhatsApp tracking
document.getElementById("whatsappBtn").addEventListener("click",function(){
gtag('event','whatsapp_click',{
event_category:'Contact',
event_label:'Floating WhatsApp'
});
});
</script>

</body>
</html>
