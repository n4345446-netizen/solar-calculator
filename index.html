<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Load Calculator</title>

<style>
body{
background:#0f0f0f;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding:20px
}
h2{text-align:center;color:#FFD700}

.calculator{
max-width:450px;
margin:auto
}

.input-box{
margin-bottom:12px
}

label{
display:block;
color:#FFD700;
margin-bottom:5px;
font-weight:bold
}

input{
width:100%;
padding:10px;
border-radius:6px;
border:none;
background:#1a1a1a;
color:#fff
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#FFD700,#FFA500);
font-weight:bold;
cursor:pointer
}

#result{
margin-top:20px;
font-size:18px;
text-align:center;
color:#FFD700
}
</style>
</head>

<body>

<h2>Solar Load Calculator</h2>

<div class="calculator">

<div class="input-box"><label>Fans</label><input id="fans" type="number"></div>
<div class="input-box"><label>Lights</label><input id="lights" type="number"></div>
<div class="input-box"><label>TV</label><input id="tv" type="number"></div>
<div class="input-box"><label>AC (1hp)</label><input id="ac1" type="number"></div>
<div class="input-box"><label>AC (1.5hp)</label><input id="ac15" type="number"></div>
<div class="input-box"><label>Refrigerator</label><input id="fridge" type="number"></div>
<div class="input-box"><label>Freezer</label><input id="freezer" type="number"></div>
<div class="input-box"><label>Water Pump</label><input id="pump" type="number"></div>
<div class="input-box"><label>Laptops</label><input id="laptops" type="number"></div>
<div class="input-box"><label>Phones</label><input id="phones" type="number"></div>

<div id="result"></div>

<button onclick="calculate()">Calculate Load</button>

</div>

<script>
const watts = {
fans:75,
lights:20,
tv:150,
ac1:750,
ac15:1100,
fridge:200,
freezer:180,
pump:500,
laptops:65,
phones:10
};

function calculate(){
let totalWatts = 0;

for(let item in watts){
let qty = Number(document.getElementById(item).value) || 0;
totalWatts += qty * watts[item];
}

let kva = (totalWatts / 1000).toFixed(2);

document.getElementById("result").innerHTML =
`Total Load: <b>${totalWatts} W</b><br>
Required Inverter Size: <b>${kva} kVA</b>`;
}
</script>

</body>
</html>
