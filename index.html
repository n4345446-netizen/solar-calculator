<!-- Header -->
<header>
  <div class="logo">
    <i class="fa-solid fa-sun"></i> Solar Calculator
  </div>

  <!-- Hamburger menu for mobile -->
  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Navigation -->
  <nav id="nav-menu">
    <a href="#home"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#calculator"><i class="fa-solid fa-calculator"></i> Calculator</a>
    <a href="#about"><i class="fa-solid fa-circle-info"></i> About</a>
  </nav>
</header>

<!-- CSS -->
<style>
/* Header */
header {
  background: #000;
  color: #FFD700;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 24px;
  font-weight: bold;
}

header .logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Navigation */
nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: #FFD700;
  text-decoration: none;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  transition: background 0.3s;
}

nav a:hover {
  background: #333;
  transform: scale(1.05);
}

/* Hamburger Menu */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 4px;
}

.hamburger div {
  width: 25px;
  height: 3px;
  background: #FFD700;
  border-radius: 2px;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  nav {
    display: none;
    position: absolute;
    top: 60px;
    right: 0;
    background: #1a1a1a;
    flex-direction: column;
    width: 200px;
    padding: 10px;
    border-radius: 8px;
  }

  nav.show {
    display: flex;
  }

  .hamburger {
    display: flex;
  }
}
</style>

<!-- JS -->
<script>
function toggleMenu() {
  const nav = document.getElementById('nav-menu');
  nav.classList.toggle('show');
}
</script>
