<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Load Calculator</title>

<!-- Font Awesome (icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:"Times New Roman", serif;
    background:#f4f6f8;
    color:#222;
}

/* HEADER */
header{
    background:#0b3d2e;
    color:#fff;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:22px;
}

/* MENU ICON */
.menu{
    font-size:22px;
    cursor:pointer;
}

/* MAIN */
.container{
    padding:20px;
    max-width:900px;
    margin:auto;
}

/* VIDEO */
.video-box{
    margin-bottom:25px;
    animation:fadeIn 1s ease-in;
}

video{
    width:100%;
    border-radius:12px;
}

/* CALCULATOR */
.calculator{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.calculator h2{
    margin-bottom:15px;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

select, input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #000;
    background:#000;
    color:#fff;
    font-size:16px;
}

/* RESULT */
.result{
    margin-top:20px;
    padding:15px;
    background:#0b3d2e;
    color:#fff;
    border-radius:10px;
    font-size:18px;
    text-align:center;
}

/* IMAGE */
.image-box{
    margin-top:30px;
    animation:fadeInUp 1.2s ease-in;
}

.image-box img{
    width:100%;
    border-radius:14px;
}

/* WHATSAPP FLOAT */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:#fff;
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    text-decoration:none;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* ANIMATIONS */
@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes fadeInUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* MOBILE */
@media(max-width:600px){
    header h1{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Solar Calculator</h1>
    <i class="fas fa-bars menu"></i>
</header>

<div class="container">

    <!-- VIDEO -->
    <div class="video-box">
        <video controls>
            <source src="VID_20260128_171351.mp4" type="video/mp4">
            Your browser does not support video.
        </video>
    </div>

    <!-- CALCULATOR -->
    <div class="calculator">
        <h2>Load Calculation</h2>

        <label>Appliance</label>
        <select id="appliance">
            <option value="150">Refrigerator</option>
            <option value="300">Freezer</option>
            <option value="900">Air Conditioner 1hp</option>
            <option value="1200">Air Conditioner 1.5hp</option>
            <option value="1800">Air Conditioner 2hp</option>
            <option value="750">Water Pump</option>
            <option value="1000">Iron</option>
            <option value="1500">Water Heater</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="quantity" value="0" min="0">

        <label>Backup Time (hours)</label>
        <input type="number" id="backup" value="0" min="0">

        <div class="result" id="result">
            Total Load: 0 W<br>
            Energy Required: 0 Wh
        </div>
    </div>

    <!-- IMAGE -->
    <div class="image-box">
        <img src="images/ceedcfb94e0afa0c49e5351911cb59ea.jpg" alt="Solar System">
    </div>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/234XXXXXXXXXX" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
function calculate(){
    let appliance = parseInt(document.getElementById("appliance").value);
    let qty = parseInt(document.getElementById("quantity").value) || 0;
    let backup = parseInt(document.getElementById("backup").value) || 0;

    let totalLoad = appliance * qty;
    let energy = totalLoad * backup;

    document.getElementById("result").innerHTML =
        `Total Load: ${totalLoad} W<br>Energy Required: ${energy} Wh`;
}

document.getElementById("appliance").addEventListener("change", calculate);
document.getElementById("quantity").addEventListener("input", calculate);
document.getElementById("backup").addEventListener("input", calculate);
</script>

</body>
</html>
