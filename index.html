<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Calculator</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
*{box-sizing:border-box;margin:0;font-family:'Times New Roman',Times,serif;scroll-behavior:smooth}
body{background:#111;color:#eee;overflow-x:hidden}
header{background:#000;color:#FFD700;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:bold;position:fixed;top:0;width:100%;z-index:100}
nav{display:flex;gap:20px}
nav a{color:#FFD700;text-decoration:none;font-size:24px}
.hamburger{display:none}
@media(max-width:768px){
nav{display:none;position:absolute;top:60px;right:0;background:#1a1a1a;flex-direction:column}
nav.show{display:flex}
.hamburger{display:flex;flex-direction:column}
}
.section{padding:50px 20px;text-align:center}
.dark{background:#000}
.calculator{max-width:500px;margin:auto}
.input-card{background:#1a1a1a;border-left:5px solid #FFD700;padding:12px;margin-top:15px;border-radius:8px}
.input-card label{color:#FFD700;font-weight:bold}
.input-card input,.input-card select{width:100%;padding:8px;border-radius:5px;border:none}
button{width:100%;padding:15px;margin-top:20px;background:linear-gradient(45deg,#FFD700,#FFA500);border:none;font-weight:bold;border-radius:50px;cursor:pointer}
#result{margin-top:20px;font-size:18px;color:#FFD700}
#stickyLoad{position:fixed;top:80px;right:20px;background:#000;padding:15px;border-radius:12px;color:#FFD700;display:none}
.whatsapp-circle{position:fixed;bottom:25px;right:25px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:30px;z-index:200}
</style>

<!-- GA4 BASE CODE -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2RBYGDKE96"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-2RBYGDKE96');
</script>

</head>
<body>

<header>
<div class="logo"><i class="fa-solid fa-sun"></i> Solar Calculator</div>
<div class="hamburger" onclick="toggleMenu()">☰</div>
<nav id="nav-menu">
<a href="#calculator"><i class="fa-solid fa-calculator"></i></a>
</nav>
</header>

<div id="stickyLoad">Running Load: <strong>0 kVA</strong></div>

<section id="calculator" class="section dark">
<h2>Solar Load Calculator</h2>

<div class="calculator">

<div class="input-card"><label>Fans</label><input type="number" id="fans" value="0"></div>
<div class="input-card"><label>AC 1hp</label><input type="number" id="ac1" value="0"></div>
<div class="input-card"><label>AC 1.5hp</label><input type="number" id="ac15" value="0"></div>
<div class="input-card"><label>AC 2hp</label><input type="number" id="ac2" value="0"></div>
<div class="input-card"><label>Lights</label><input type="number" id="lights" value="0"></div>
<div class="input-card"><label>TV</label><input type="number" id="tv" value="0"></div>
<div class="input-card"><label>Phones</label><input type="number" id="phones" value="0"></div>
<div class="input-card"><label>Laptops</label><input type="number" id="laptops" value="0"></div>
<div class="input-card"><label>Refrigerator</label><input type="number" id="refrigerator" value="0"></div>
<div class="input-card"><label>Freezer</label><input type="number" id="freezer" value="0"></div>
<div class="input-card"><label>Water Pump</label><input type="number" id="pump" value="0"></div>
<div class="input-card"><label>Iron</label><input type="number" id="iron" value="0"></div>
<div class="input-card"><label>Water Heater</label><input type="number" id="heater" value="0"></div>

<div class="input-card">
<label>Surge Factor</label>
<select id="surgeFactor">
<option value="1">None</option>
<option value="1.25">Medium</option>
<option value="1.3">Heavy</option>
</select>
</div>

<div class="input-card"><label>Backup Hours</label><input type="number" id="hours" value="0"></div>

<div id="result"></div>
<button id="pricingBtn" onclick="sendToWhatsApp()">Get Pricing</button>

</div>
</section>

<a id="whatsappBtn" class="whatsapp-circle" href="https://wa.me/2347059640476" target="_blank">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
function toggleMenu(){
document.getElementById('nav-menu').classList.toggle('show');
}

const watts={
fans:75,ac1:750,ac15:1100,ac2:1500,lights:20,tv:150,phones:10,laptops:65,
refrigerator:200,freezer:180,pump:500,iron:1000,heater:1500
};

const surgeDevices=['ac1','ac15','ac2','pump','refrigerator','freezer','iron','heater'];

let runKVA=0,surgeKVA=0,inverter=0;

function calculate(){
let runTotal=0,surgeTotal=0;
const surge=parseFloat(document.getElementById('surgeFactor').value);

for(let id in watts){
let qty=+document.getElementById(id).value;
let w=qty*watts[id];
runTotal+=w;
surgeTotal+=surgeDevices.includes(id)?w*surge:w;
}

runKVA=(runTotal/1000).toFixed(2);
surgeKVA=(surgeTotal/1000).toFixed(2);
inverter=Math.ceil(surgeKVA*2)/2;

let warn=surgeKVA/runKVA>1.25?"<br>⚠️ Surge too high. Bigger inverter required":"";

document.getElementById('result').innerHTML=
`Running Load: <b>${runKVA} kVA</b><br>
Surge Load: <b>${surgeKVA} kVA</b><br>
Recommended Inverter: <b>${inverter} kVA</b>${warn}`;

document.getElementById('stickyLoad').style.display='block';
document.querySelector('#stickyLoad strong').textContent=`${runKVA} kVA`;
}

Object.keys(watts).forEach(id=>{
document.getElementById(id).addEventListener('input',calculate);
});
document.getElementById('surgeFactor').addEventListener('change',calculate);

function sendToWhatsApp(){
const h=document.getElementById('hours').value;
const msg=`Solar Request:
Running Load: ${runKVA} kVA
Surge Load: ${surgeKVA} kVA
Recommended Inverter: ${inverter} kVA
Backup Hours: ${h}`;
gtag('event','pricing_click',{event_category:'Lead',event_label:'Get Pricing'});
window.open("https://wa.me/2347059640476?text="+encodeURIComponent(msg));
}

// WhatsApp floating button tracking
document.getElementById('whatsappBtn').addEventListener('click',function(){
gtag('event','whatsapp_click',{event_category:'Contact',event_label:'Floating WhatsApp'});
});
</script>

</body>
</html>
