<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Calculator</title>

  <!-- Font Awesome for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-yHkeVhJZBqY4i2BZ6jExV3n1cKqI0K1jM+W3WjcyQfDpzLt45sWRwG3EdH1T9QELP3K+2Zq9/pJ1r0O2s5T9CQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <style>
    /* Header */
    header {
      background: #000;
      color: #FFD700;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Navigation */
    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #FFD700;
      text-decoration: none;
      font-weight: bold;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 6px;
      transition: transform 0.3s, color 0.3s;
    }

    nav a:hover {
      transform: scale(1.2);
      color: #FFA500;
    }

    /* Hamburger Menu */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 4px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background: #FFD700;
      border-radius: 2px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      nav {
        display: none;
        position: absolute;
        top: 60px;
        right: 0;
        background: #1a1a1a;
        flex-direction: column;
        width: 150px;
        padding: 10px;
        border-radius: 8px;
      }

      nav.show {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-sun"></i> Solar Calculator
    </div>

    <!-- Hamburger menu for mobile -->
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <!-- Navigation with only icons -->
    <nav id="nav-menu">
      <a href="#home" title="Home"><i class="fa-solid fa-house"></i></a>
      <a href="#calculator" title="Calculator"><i class="fa-solid fa-calculator"></i></a>
      <a href="#about" title="About"><i class="fa-solid fa-circle-info"></i></a>
    </nav>
  </header>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('nav-menu');
      nav.classList.toggle('show');
    }
  </script>
</body>
</html>
